<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Lista</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 16px; }
    h1 {
      font-size: 1.5rem;
      color: #fff;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 small { font-size: 0.8rem; color: #888; font-weight: normal; }

    .card {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #2a2a4a;
    }

    .load-form { display: flex; gap: 8px; flex-wrap: wrap; }
    .load-form input {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0f0f1a;
      color: #fff;
      font-size: 1rem;
    }
    .load-form input::placeholder { color: #666; }
    .load-form button {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: #4f46e5;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .load-form button:active { transform: scale(0.97); }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .toolbar button {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .toolbar button:active { background: #2a2a4a; }
    .toolbar button.primary { background: #4f46e5; border-color: #4f46e5; color: #fff; }
    .toolbar button.success { background: #22c55e; border-color: #22c55e; color: #fff; }
    .toolbar button.danger { background: #ef4444; border-color: #ef4444; color: #fff; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .stat-item {
      background: #1a1a2e;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      border: 1px solid #2a2a4a;
    }
    .stat-item .num { font-size: 1.4rem; font-weight: bold; color: #818cf8; }
    .stat-item .label { font-size: 0.75rem; color: #888; margin-top: 2px; }

    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .filters input, .filters select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0f0f1a;
      color: #fff;
      font-size: 0.9rem;
    }
    .filters input { flex: 1; min-width: 150px; }
    .filters select { min-width: 120px; }

    .channels { display: flex; flex-direction: column; gap: 8px; }
    .channel {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1a1a2e;
      border-radius: 8px;
      padding: 10px 14px;
      border: 1px solid #2a2a4a;
      transition: border-color 0.2s;
    }
    .channel:active { border-color: #4f46e5; }
    .channel img {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: contain;
      background: #0f0f1a;
      flex-shrink: 0;
    }
    .channel-info { flex: 1; min-width: 0; }
    .channel-name {
      font-size: 0.95rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .channel-meta {
      font-size: 0.75rem;
      color: #888;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 2px;
    }
    .channel-meta span { background: #2a2a4a; padding: 1px 6px; border-radius: 4px; }
    .channel-url {
      font-size: 0.65rem;
      color: #555;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      max-width: 100%;
    }
    .channel-url:hover { color: #818cf8; }
    .channel-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .channel-actions button {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .channel-actions button:active { opacity: 0.8; }
    .channel-actions .play-btn { background: #22c55e; color: #fff; }
    .channel-actions .edit-btn { background: #4f46e5; color: #fff; }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }
    .pagination button {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #1a1a2e;
      color: #fff;
      cursor: pointer;
    }
    .pagination button:disabled { opacity: 0.3; }
    .pagination button:active:not(:disabled) { background: #2a2a4a; }
    .pagination span { font-size: 0.9rem; color: #888; }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    .error {
      background: #3b1a1a;
      border: 1px solid #5c2a2a;
      color: #ff6b6b;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .empty {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a2e;
      border: 1px solid #4f46e5;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
      z-index: 100;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      background: #1a1a2e;
      border-radius: 12px;
      border: 1px solid #2a2a4a;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .modal-header h2 { font-size: 1.1rem; color: #fff; }
    .modal-header button {
      background: none;
      border: none;
      color: #888;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px;
    }
    .modal-header button:hover { color: #fff; }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 4px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0f0f1a;
      color: #fff;
      font-size: 0.95rem;
    }
    .form-group input::placeholder { color: #555; }
    .form-group input:focus { outline: none; border-color: #4f46e5; }
    .form-group.checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group.checkbox input { width: auto; }
    .form-group.checkbox label { margin: 0; }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .modal-actions button {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .modal-actions button:active { opacity: 0.8; }
    .modal-actions .btn-primary { background: #4f46e5; color: #fff; }
    .modal-actions .btn-success { background: #22c55e; color: #fff; }
    .modal-actions .btn-danger { background: #ef4444; color: #fff; }
    .modal-actions .btn-cancel { background: #2a2a4a; color: #aaa; }

    .player-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      flex-direction: column;
      z-index: 300;
    }
    .player-overlay.active { display: flex; }

    .player-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
    }
    .player-top span {
      font-size: 0.95rem;
      color: #fff;
      font-weight: 500;
    }
    .player-top button {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 4px 8px;
      opacity: 0.7;
    }
    .player-top button:hover { opacity: 1; }

    .player-video-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }
    .player-video-wrap video {
      width: 100%;
      height: 100%;
      max-height: 100vh;
      outline: none;
    }

    @media (max-width: 600px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .load-form input { min-width: 100%; }
      .load-form button { width: 100%; }
      .channel img { width: 32px; height: 32px; }
      .channel-actions button { padding: 5px 8px; font-size: 0.75rem; }
      .modal-content { max-width: 100%; border-radius: 12px 12px 0 0; margin-top: auto; }
      .modal-overlay { align-items: flex-end; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>IPTV Lista <small id="status">sin datos</small></h1>

    <div class="card">
      <div class="load-form">
        <input type="text" id="urlInput" placeholder="URL o ruta local de lista M3U8..." />
        <button id="loadBtn">Cargar</button>
      </div>
      <div style="margin-top:8px;font-size:0.8rem;color:#666;">
        Ej: https://ejemplo.com/lista.m3u8  o  /ruta/local/archivo.m3u8
      </div>
    </div>

    <div id="m3u8Bar" class="card" style="display:none;padding:10px 16px;">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <span style="color:#888;font-size:0.85rem;">URL para reproductor M3U8:</span>
        <code id="m3u8Url" style="flex:1;font-size:0.8rem;background:#0f0f1a;padding:6px 10px;border-radius:6px;word-break:break-all;min-width:150px;"></code>
        <button onclick="copyM3u8Url()" style="padding:6px 14px;border-radius:6px;border:1px solid#333;background:#1a1a2e;color:#fff;cursor:pointer;font-size:0.85rem;white-space:nowrap;">Copiar</button>
      </div>
    </div>

    <div id="statsContainer" class="stats" style="display:none;">
      <div class="stat-item"><div class="num" id="statTotal">0</div><div class="label">Canales</div></div>
      <div class="stat-item"><div class="num" id="statTv">0</div><div class="label">TV</div></div>
      <div class="stat-item"><div class="num" id="statRadio">0</div><div class="label">Radio</div></div>
      <div class="stat-item"><div class="num" id="statCat">0</div><div class="label">Categorías</div></div>
    </div>

    <div id="errorBox" class="error" style="display:none;"></div>

    <div id="toolbar" class="toolbar" style="display:none;">
      <button class="primary" onclick="openAddModal()">+ Añadir canal</button>
      <button class="success" onclick="exportPlaylist()">⬇ Exportar M3U8</button>
      <button id="saveBtn" class="danger" onclick="savePlaylist()" style="display:none;">💾 Guardar en servidor</button>
    </div>

    <div class="filters" id="filtersContainer" style="display:none;">
      <input type="text" id="searchInput" placeholder="Buscar canal..." />
      <select id="categoryFilter"><option value="">Todas</option></select>
    </div>

    <div id="channelsContainer" class="channels"></div>

    <div id="pagination" class="pagination" style="display:none;">
      <button id="prevBtn">← Anterior</button>
      <span id="pageInfo"></span>
      <button id="nextBtn">Siguiente →</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <div id="playerOverlay" class="player-overlay">
    <div class="player-top">
      <span id="playerChannelName">Canal</span>
      <button onclick="closePlayer()">✕</button>
    </div>
    <div class="player-video-wrap">
      <video id="playerVideo" controls autoplay playsinline></video>
      <div id="playerStatus" style="position:absolute;bottom:60px;left:50%;transform:translateX(-50%);color:#888;font-size:0.85rem;text-align:center;pointer-events:none;"></div>
    </div>
  </div>

  <div id="editModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="editModalTitle">Editar Canal</h2>
        <button onclick="closeEditModal()">✕</button>
      </div>
      <form id="editForm" onsubmit="saveEdit(event)">
        <div class="form-group">
          <label>Nombre del canal</label>
          <input id="editName" type="text" placeholder="Ej: CNN en Español" required />
        </div>
        <div class="form-group">
          <label>URL del stream</label>
          <input id="editUrl" type="text" placeholder="https://..." required />
        </div>
        <div class="form-group">
          <label>Categoría / Grupo</label>
          <input id="editCategory" type="text" placeholder="Ej: Noticias, Deportes..." />
        </div>
        <div class="form-group">
          <label>Logo (URL)</label>
          <input id="editLogo" type="text" placeholder="https://ejemplo.com/logo.png" />
        </div>
        <div class="form-group">
          <label>Idioma</label>
          <input id="editLanguage" type="text" placeholder="Ej: Spanish, English..." />
        </div>
        <div class="form-group">
          <label>Calidad</label>
          <input id="editQuality" type="text" placeholder="Ej: 1080p, 720p..." />
        </div>
        <div class="form-group checkbox">
          <input id="editRadio" type="checkbox" />
          <label for="editRadio">Es radio</label>
        </div>
        <input type="hidden" id="editId" value="" />
        <div class="modal-actions">
          <button type="submit" class="btn-primary" id="editSubmitBtn">Guardar</button>
          <button type="button" class="btn-danger" id="deleteBtn" onclick="deleteChannel()">Eliminar</button>
          <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
